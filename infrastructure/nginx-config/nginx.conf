worker_processes auto;

events {
    worker_connections 1024;
}
http{
    include /opt/homebrew/etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    limit_req_zone $binary_remote_addr
        zone=api_limit:10m
        rate=20r/s;

    limit_req_zone $binary_remote_addr
        zone=auth_limit:10m
        rate=120r/m;

    limit_req_zone $binary_remote_addr
        zone=oauth_limit:10m
        rate=120r/m;
    upstream problem{
        least_conn;
        server localhost:5000;
        server localhost:5001;
        server localhost:5002;
    }
    upstream auth{
        least_conn;
        server localhost:3011;
        server localhost:3012;
        server localhost:3013;
    }
    upstream execution{
        least_conn;
        server localhost:6000;
        server localhost:6001;
        server localhost:6002;
    }
    server{
        listen 8080;
        server_name localhost;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        error_page 429 = @rate_limited;
        location /auth/{
        limit_req zone=auth_limit burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://auth;
        }
        location = /auth/google {
        limit_req zone=oauth_limit burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://auth;
        }
        location = /auth/google/callback {
        limit_req zone=oauth_limit burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://auth;
        }
        location /problem/{
        limit_req zone=api_limit burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://problem;
        }
        location /execution/{
        limit_req zone=api_limit burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://execution;
        }
        location @rate_limited {
        internal;
        default_type text/html;
        add_header Retry-After 10 always;
        add_header Cache-Control "no-store" always;
        return 429 '<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Too many requests</title></head><body><h1>Too many requests</h1><p>Please wait a moment and try again.</p></body></html>';
        }
    }
    
    
}